[package]
name = "fhe-memory-lab"
version = "0.0.1"
edition = "2024"

[dependencies]
tfhe = { version = "~1.6", features = ["boolean", "shortint", "integer"] }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "linear_scan"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
